theme = "gruvbox-material"

[editor]
  auto-save = true
  bufferline = "never"
  color-modes = true

[editor.soft-wrap]
  enable = true

[editor.auto-pairs]
  '(' = ')'
  '{' = '}'
  '[' = ']'
  "'" = "'"
  '"' = '"'
  '`' = '`'
  '<' = '>'

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "register", "position", "file-encoding", "version-control", "spacer"]
# mode.normal = "NORMAL"
# mode.insert = "INSERT"
# mode.select = "SELECT"

[keys.normal]
  "Cmd-s" = ":update"
  
[keys.insert]
  "C-[" = "normal_mode"
